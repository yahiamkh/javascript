<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script> 
        let nombre = prompt("Introduce tu nombre:");
        let abandonar = confirm(nombre + ", ¿quieres abandonar el programa?");
        if (abandonar) alert(nombre + ", has decidido ABANDONAR el programa.");
        else alert(nombre + ", has decidido CONTINUAR con el programa.");
    </script>
</body>
</html>
