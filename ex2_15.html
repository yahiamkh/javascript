<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var columnas = parseInt(prompt("Introduce el número de columnas de la tabla:"));
        var alto = parseInt(prompt("Introduce el alto de las celdas (en pixels):"));
        var ancho = parseInt(prompt("Introduce el ancho de las celdas (en pixels):"));

        document.write("<table border='1'>");
        document.write("<tr>");

        for (var i = 1; i <= columnas; i++) {
            if(i % 2 != 0){
                document.write("<td height='" + alto + "' width='" + ancho + "' bgcolor='black'>&nbsp;</td>");
            }else{
                document.write("<td height='" + alto + "' width='" + ancho + "'>&nbsp;</td>");
            }
            
        }

        document.write("</tr>");
        document.write("</table>");
    </script>
</body>
</html>
