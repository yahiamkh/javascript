<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let tablaNumeros = new Array(10);

        function manejarTabla(tablaNumeros) {

            
            for (i = 0; i < tablaNumeros.length; i++) {
                tablaNumeros[i] = Math.floor(Math.random() * 101);
            }

            tablaNumeros.sort((a, b) => {
                if (a % 10 === 0 && b % 10 != 0) {
                    return -1;
                } else if (b % 10 === 0 && a % 10 != 0) {
                    return 1;
                } else {
                    return a - b;
                }
            });
        }

        manejarTabla(tablaNumeros);
        console.log(tablaNumeros)
    </script>
</body>

</html>
