  <body>
    <script>
      function regalosUnicos(regalos) {
        return regalos.map(
          (regalo) => regalos.indexOf(regalo) === regalos.lastIndexOf(regalo),
        );
      }
      console.log(regalosUnicos(["libro", "pelota", "libro", "puzzle"]));
    </script>
  </body>
