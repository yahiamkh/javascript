<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        let num = parseInt(prompt("Introduce el numero hasta el que quieras sumar:"));

        function sumTo(num) {
            if (num === 0) {
                return 0;
            }

            return num + sumTo(num - 1);
        }

        console.log(sumTo(num));

    </script>
</body>

</html>
