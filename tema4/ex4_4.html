<!DOCTYPE html>

</head>
<body>
    <script>
        let invertida = function(palabra){
            var result = "";
            for(let i = palabra.length - 1; i >= 0; i--){
                result += palabra[i];
            }
            return result;
        };

        console.log(invertida("yahia"))
        
    </script>
</body>
</html>
