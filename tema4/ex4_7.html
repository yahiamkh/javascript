<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function masaMaximaCamion(cereal) {
        let volumenEspecifico;

        if (cereal === "avena") volumenEspecifico = 1.8;
        else if (cereal === "cebada") volumenEspecifico = 1.4;
        else if (cereal === "maiz") volumenEspecifico = 1.2;

        return function (volumen) {
          return volumen / volumenEspecifico;
        };
      }

      var masaCamionAvena = masaMaximaCamion("avena");
      var masaCamionCebada = masaMaximaCamion("cebada");
      var masaCamionMaiz = masaMaximaCamion("maiz");

      alert(masaCamionAvena(20));
      alert(masaCamionCebada(20));
      alert(masaCamionMaiz(20));
    </script>
  </body>
</html>
