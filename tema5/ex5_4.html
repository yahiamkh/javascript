<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function invertirCadena(cadena) {
            return cadena.split("").reverse().join("");
        }

        // Ejemplo de uso:
        console.log(invertirCadena("Hola mundo")); // "odnum aloH"
    </script>
</body>

</html>
