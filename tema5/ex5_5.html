<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function esPalindromo(cadena) {
            cadena = cadena.toLowerCase().replace(/\s/g, "");

            for (let i = 0; i < cadena.length / 2; i++) {
                if (cadena.charAt(i) !== cadena.charAt(cadena.length - 1 - i)) {
                    return false;
                }
            }

            return true;
        }

        console.log(esPalindromo("ana lleva al oso la avellana")); // true
        console.log(esPalindromo("sale el as"));                  // true
        console.log(esPalindromo("isaac no ronca asi"));          // true
        console.log(esPalindromo("luz azul"));                    // true
        console.log(esPalindromo("Hola mundo"));                 // false
    </script>
</body>

</html>
